<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NECKLACE · Euclidean rhythm necklaces</title>
  <meta name="description" content="Euclidean rhythms drawn as polygons inscribed in a circle and played in the browser. Toussaint's rhythm necklaces, zero dependencies.">
  <meta name="theme-color" content="#0a0c12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23596179' stroke-width='2'/%3E%3Cpath d='M32 6 L50.4 50.4 L13.6 32 Z' fill='%23f7b73355' stroke='%23f7b733' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='6' r='4' fill='%23f7b733'/%3E%3Ccircle cx='50.4' cy='50.4' r='4' fill='%23f7b733'/%3E%3Ccircle cx='13.6' cy='32' r='4' fill='%23f7b733'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>NECKLACE</h1>
        <span>Euclidean rhythm necklaces</span>
      </div>
      <div class="transport">
        <button id="play" class="btn primary" aria-pressed="false" title="Play / stop (space)">Play</button>
        <label class="tempo">Tempo
          <input id="tempo" type="range" min="40" max="240" value="120" aria-label="Tempo in beats per minute">
          <output id="tempo-out">120</output><span class="unit">bpm</span>
        </label>
      </div>
    </header>
    <main class="layout">
      <div class="stage">
        <canvas id="stage" aria-label="Rhythm necklaces"></canvas>
        <div class="hint" id="hint">Click the necklace to hear its voices</div>
      </div>
      <aside class="panel" id="panel"></aside>
    </main>
    <footer>
      <span>Rhythms from Godfried Toussaint, <a href="http://cgm.cs.mcgill.ca/~godfried/publications/banff.pdf" target="_blank" rel="noopener">The Euclidean Algorithm Generates Traditional Musical Rhythms</a> (2005)</span>
      <span><a href="https://github.com/Quigles1337/NECKLACE" target="_blank" rel="noopener">github.com/Quigles1337/NECKLACE</a></span>
    </footer>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
